# Записите на самия elsys.club (apex). Файлът е само за maintainer-а,
# build_zone.py го слива с clubs/*.yaml.
#
# 192.0.2.1 е placeholder (адрес от документационния диапазон), зад който няма
# сървър. Записът е proxied, а същинският redirect е Single Redirect Rule в
# Cloudflare и не е част от това репо - DNS записът сам не пренасочва нищо.
'':
  type: A
  value: 192.0.2.1
  octodns:
    cloudflare:
      proxied: true
