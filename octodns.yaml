---
# Основна конфигурация на OctoDNS.
#
# "config" (YamlProvider) е source: чете зоната от zones/elsys.club.yaml,
# който се генерира от clubs/*.yaml чрез .github/actions/build-zone.
#
# "cloudflare" (CloudflareProvider) е target: реалният DNS в Cloudflare.
# Токенът се чете от променливата на средата CLOUDFLARE_TOKEN — никога
# не се пише в конфигурацията.

providers:
  config:
    class: octodns.provider.yaml.YamlProvider
    directory: ./zones
    enforce_order: false

  cloudflare:
    class: octodns_cloudflare.CloudflareProvider
    token: env/CLOUDFLARE_TOKEN
    # Page Rules endpoint-ът не поддържа account-scoped API токени (само
    # legacy Global API Key), а и не ни трябва — не ползваме URLFWD записи.
    pagerules: false

# Root DNS is still managed manually by Kiril and supports his redirect.
# Exclude it from both desired and existing zones so sync cannot delete it.
processors:
  preserve-manual-apex:
    class: octodns.processor.filter.NameRejectlistFilter
    rejectlist:
      - ''
    include_target: true

zones:
  elsys.club.:
    sources:
      - config
    processors:
      - preserve-manual-apex
    targets:
      - cloudflare
